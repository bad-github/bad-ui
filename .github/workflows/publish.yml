# GitHub Actions 在服务器读取本文件；本地保存不会执行，也不会部署 Storybook。
# name 是 Actions 页面展示的名称；npm Trusted Publisher 绑定的是文件名 publish.yml。
name: Publish npm package

# 发布正式 GitHub Release 才会上传；普通 push / PR 不发布。
on:
  release:
    # 点击 Publish release 时触发；草稿不会发布，预发布由下方 job 条件跳过。
    types: [published]

# 限制工作流的 GITHUB_TOKEN 权限；未列出的权限默认为 none。
permissions:
  # 允许检出仓库源码，不需要写入仓库或创建 Release 的权限。
  contents: read
  # 允许申请 OIDC 身份令牌，交给 npm 验证；不需要配置 NPM_TOKEN。
  id-token: write

# 不取消正在上传的发布；不同版本互不取消。
concurrency:
  # ${{ ... }} 是 GitHub 表达式；同一个 Release 标签使用同一并发组。
  group: npm-publish-${{ github.event.release.tag_name }}
  # 同组已有运行时等待，避免中途取消上传；不能借此覆盖 npm 上的已有版本。
  cancel-in-progress: false

jobs:
  publish:
    # 仅允许原仓库发布正式 Release；fork 仓库和 pre-release 跳过整个任务。
    if: ${{ github.repository == 'bad-github/bad-ui' && !github.event.release.prerelease }}
    # 在 GitHub 托管的 Ubuntu 虚拟机执行；npm Trusted Publishing 支持此环境。
    runs-on: ubuntu-24.04
    # 安装、浏览器测试或构建异常时，最多运行 30 分钟。
    timeout-minutes: 30
    env:
      # 对全部步骤生效，让工具使用 CI 模式；字符串避免 YAML 布尔值歧义。
      CI: 'true'

    # steps 按顺序执行；前一步失败，后续普通步骤跳过，不会继续上传 npm。
    # uses 调用现成 Action，@v6 是 Action 版本；run 执行 shell 命令。
    steps:
      - name: Checkout release source
        uses: actions/checkout@v6
        with:
          # 使用 Release 标签对应的源码，而不是运行时 main 的最新提交。
          ref: ${{ github.event.release.tag_name }}
          # 不在检出的 Git 配置中保留认证凭证。
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          # Node 24 自带支持 npm OIDC 发布的 npm；要求 npm >= 11.5.1。
          node-version: '24'
          # 发布到 npm 官方仓库，而不是 GitHub Packages。
          registry-url: https://registry.npmjs.org/
          # 发布任务关闭依赖缓存，pnpm Action 的缓存也在下方关闭。
          package-manager-cache: false

      - name: Check release version
        # 读取组件包清单，根 package.json 的版本不用于本次发布。
        working-directory: packages/ui
        env:
          # 通过环境变量传递标签，避免把事件文本直接拼进 shell 脚本。
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        # 用 Node 执行下面的 JavaScript；引号包裹的 NODE 阻止 shell 展开脚本文本。
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const { name, version } = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          // 只接受 x.y.z 正式版本，不接受 beta、rc 或其他预发布版本。
          const stableVersion = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/;
          if (name !== '@badnpm/ui' || !stableVersion.test(version)) {
            throw new Error('Only stable versions of @badnpm/ui may be published here.');
          }
          // 例如包版本为 0.0.1，Release 标签必须为 v0.0.1，否则终止发布。
          if (process.env.RELEASE_TAG !== `v${version}`) {
            throw new Error(`Release tag must be v${version}; got ${process.env.RELEASE_TAG}`);
          }
          NODE

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          # pnpm 版本取根 package.json 的 packageManager；这里只安装 pnpm 工具。
          run_install: false
          cache: false

      - name: Install locked dependencies
        # 严格按 pnpm-lock.yaml 安装；清单与锁文件不一致时失败，不自动修改锁文件。
        run: pnpm install --frozen-lockfile

      # 在发布源码上重新检查，不依赖另一个独立工作流的运行状态。
      - name: Check types
        # --filter 指定工作区中的组件包；typecheck 执行 tsc --noEmit。
        run: pnpm --filter @badnpm/ui typecheck

      - name: Lint UI package
        # 对组件包执行 ESLint；出现错误即停止后续发布步骤。
        run: pnpm --filter @badnpm/ui lint

      - name: Install Chromium
        # 安装锁定 Playwright 对应的 Chromium 和 Ubuntu 系统依赖。
        run: pnpm --filter @badnpm/ui exec playwright install --with-deps chromium

      - name: Run Storybook tests
        # Vitest 运行组件、交互和已配置的无障碍检查；无需另起 Storybook 开发服务。
        run: pnpm --filter @badnpm/ui test-storybook

      - name: Build package
        # Rollup 生成 dist 中的 JS、类型声明、CSS 和字体；此步骤尚未上传。
        run: pnpm --filter @badnpm/ui build

      - name: Preview package contents
        working-directory: packages/ui
        # 在日志中展示预计发布的文件；dry-run 不创建 tarball，也不上传 npm。
        # 发布范围由组件包 package.json 的 files 及 npm 自动包含规则决定。
        run: npm pack --dry-run

      # npm 的 Trusted Publisher 必须允许直接 npm publish 操作。
      # npm 配置：所有者 bad-github、仓库 bad-ui、文件 publish.yml、Environment 留空。
      - name: Publish to npm using OIDC
        # 必须在组件包目录执行，避免误发布根目录的 private 工作区包。
        working-directory: packages/ui
        # 此命令才真正上传：public 为公开包，latest 为默认安装版本标签。
        # npm 自动使用 OIDC 认证；已存在的同名同版本不能重复发布。
        run: npm publish --access public --tag latest
